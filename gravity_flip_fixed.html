<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{font-family:system-ui,sans-serif;background:transparent;overflow:hidden;}
#wrap{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;}
canvas{display:block;border-radius:0 0 12px 12px;cursor:pointer;touch-action:none;}
#hud{display:flex;justify-content:space-around;align-items:center;padding:12px 8px 10px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-bottom:none;border-radius:12px 12px 0 0;}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sl{font-size:10px;color:var(--color-text-tertiary);letter-spacing:.5px;text-transform:uppercase;}
.sv{font-size:18px;font-weight:500;color:var(--color-text-primary);}
#ovr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:0 0 12px 12px;background:var(--color-background-primary);z-index:10;padding:20px;}
#ovr h2{font-size:22px;font-weight:500;color:var(--color-text-primary);}
#ovr p{font-size:13px;color:var(--color-text-secondary);text-align:center;max-width:260px;line-height:1.6;}
#ovr button{padding:11px 30px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:14px;cursor:pointer;}
.lb{width:260px;border:0.5px solid var(--color-border-tertiary);border-radius:8px;overflow:hidden;}
.lbr{display:flex;gap:8px;padding:7px 12px;font-size:12px;border-bottom:0.5px solid var(--color-border-tertiary);}
.lbr:last-child{border-bottom:none;}
.lbr.me{background:var(--color-background-secondary);}
.lbn{flex:1;color:var(--color-text-primary);}
.lbs{font-weight:500;color:#1D9E75;}
input.ni{padding:9px 12px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:inherit;width:200px;outline:none;}
</style>

<div id="wrap">
  <div id="hud">
    <div class="stat"><span class="sl">Time</span><span class="sv" id="ti">0.0</span></div>
    <div class="stat"><span class="sl">Flips</span><span class="sv" id="fl">0</span></div>
    <div class="stat"><span class="sl">Speed</span><span class="sv" id="sp">1.0x</span></div>
    <div class="stat"><span class="sl">Best</span><span class="sv" id="bs">0.0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="c"></canvas>
    <div id="ovr">
      <h2>Gravity Flip</h2>
      <p>You're a dot falling through a twisting tunnel.<br><strong>Tap or click</strong> to flip gravity.<br>Don't touch the walls!</p>
      <input class="ni" id="ni" placeholder="Your name (optional)" maxlength="16"/>
      <button onclick="startG()">Start</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min((window.innerWidth||420)-16,420);
const H=Math.min(window.innerHeight*.68,500);
cv.width=W; cv.height=H;

const lb=JSON.parse(localStorage.getItem('gf2_lb')||'[]');
document.getElementById('bs').textContent=(lb[0]?.score||0).toFixed(1);

const TUNNEL_W=120, PLAYER_R=8;
let segs=[],scrollY=0,speed=2.2,gravDir=1,playerY=H/2,playerVY=0;
let alive=false,startTime=0,elapsed=0,flips=0,pname='',animId;
let trail=[];

function genSegs(){
  segs=[];
  let cx=W/2;
  for(let i=0;i<400;i++){
    const drift=(Math.random()-.5)*14;
    cx+=drift;
    cx=Math.max(TUNNEL_W/2+24,Math.min(W-TUNNEL_W/2-24,cx));
    segs.push({cx});
  }
}

function startG(){
  pname=document.getElementById('ni')?.value.trim()||'You';
  document.getElementById('ovr').style.display='none';
  genSegs();
  scrollY=0; speed=2.2; gravDir=1; playerY=H/2; playerVY=0;
  alive=true; startTime=Date.now(); elapsed=0; flips=0; trail=[];
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function flip(){
  if(!alive) return;
  gravDir*=-1; playerVY=gravDir*-2.5; flips++;
  document.getElementById('fl').textContent=flips;
}

function loop(){
  animId=requestAnimationFrame(loop);
  if(!alive) return;

  elapsed=(Date.now()-startTime)/1000;
  speed=Math.min(2.2+elapsed*0.1,9);
  document.getElementById('ti').textContent=elapsed.toFixed(1);
  document.getElementById('sp').textContent=speed.toFixed(1)+'x';

  scrollY+=speed;
  playerVY+=gravDir*0.42;
  playerVY=Math.max(-11,Math.min(11,playerVY));
  playerY+=playerVY;

  if(playerY-PLAYER_R<=0||playerY+PLAYER_R>=H){die();return;}

  const SEG_H=18;
  const sidx=Math.floor(scrollY/SEG_H);
  const playerSegIdx=sidx+Math.floor(H/2/SEG_H);
  if(playerSegIdx<segs.length){
    const s=segs[Math.min(playerSegIdx,segs.length-1)];
    const lw=s.cx-TUNNEL_W/2, rw=s.cx+TUNNEL_W/2;
    if(W/2-PLAYER_R<=lw||W/2+PLAYER_R>=rw){die();return;}
  }
  if(sidx>=segs.length-Math.ceil(H/SEG_H)+5) genSegs(),scrollY=0;

  ctx.clearRect(0,0,W,H);

  const wallColor='#7F77DD', bgColor='#EEEDFE';
  ctx.fillStyle='var(--color-background-primary)';
  ctx.fillRect(0,0,W,H);

  for(let i=sidx;i<sidx+Math.ceil(H/SEG_H)+2&&i<segs.length-1;i++){
    const s0=segs[i],s1=segs[i+1];
    const y0=(i*SEG_H)-scrollY, y1=y0+SEG_H;
    const hw=TUNNEL_W/2;
    ctx.fillStyle=wallColor;
    ctx.beginPath();
    ctx.moveTo(0,y0);ctx.lineTo(s0.cx-hw,y0);ctx.lineTo(s1.cx-hw,y1);ctx.lineTo(0,y1);
    ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W,y0);ctx.lineTo(s0.cx+hw,y0);ctx.lineTo(s1.cx+hw,y1);ctx.lineTo(W,y1);
    ctx.closePath();ctx.fill();

    ctx.strokeStyle='rgba(127,119,221,0.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(s0.cx-hw,y0);ctx.lineTo(s1.cx-hw,y1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s0.cx+hw,y0);ctx.lineTo(s1.cx+hw,y1);ctx.stroke();
  }

  const px=W/2;
  trail.unshift({x:px,y:playerY});
  if(trail.length>20) trail.pop();
  trail.forEach((p,i)=>{
    const a=(1-i/20)*0.4;
    ctx.globalAlpha=a;
    ctx.fillStyle=wallColor;
    ctx.beginPath();ctx.arc(p.x,p.y,PLAYER_R*(1-i/24),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  ctx.beginPath();ctx.arc(px,playerY,PLAYER_R,0,Math.PI*2);
  ctx.fillStyle=bgColor;ctx.fill();
  ctx.strokeStyle=wallColor;ctx.lineWidth=2.5;ctx.stroke();

  ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=wallColor;
  ctx.fillText(gravDir===1?'▼':'▲',px,playerY);
}

function die(){
  alive=false; cancelAnimationFrame(animId);
  const score=Math.round(elapsed*10)/10;
  lb.push({name:pname,score});lb.sort((a,b)=>b.score-a.score);lb.splice(5);
  localStorage.setItem('gf2_lb',JSON.stringify(lb));
  document.getElementById('bs').textContent=(lb[0]?.score||0).toFixed(1);
  const ovr=document.getElementById('ovr');
  ovr.innerHTML=`<h2>Crashed!</h2>
    <p style="font-size:15px;font-weight:500;color:var(--color-text-primary)">${score}s survived &nbsp;·&nbsp; ${flips} flips</p>
    <div class="lb">
      <div class="lbr" style="background:var(--color-background-secondary);font-size:11px;color:var(--color-text-secondary)"><span style="width:18px">#</span><span class="lbn">Player</span><span class="lbs">Seconds</span></div>
      ${lb.map((e,i)=>`<div class="lbr${e.name===pname&&e.score===score?' me':''}"><span style="width:18px;color:var(--color-text-secondary)">${i+1}</span><span class="lbn">${e.name}</span><span class="lbs">${e.score.toFixed(1)}s</span></div>`).join('')}
    </div>
    <button onclick="reG()">Try Again</button>`;
  ovr.style.display='flex';
}
function reG(){
  document.getElementById('ovr').innerHTML=`<h2>Gravity Flip</h2><p>You're a dot falling through a twisting tunnel.<br><strong>Tap or click</strong> to flip gravity.<br>Don't touch the walls!</p><input class="ni" id="ni" placeholder="Your name (optional)" maxlength="16" value="${pname}"/><button onclick="startG()">Start</button>`;
}

cv.addEventListener('click',()=>{if(alive)flip();});
cv.addEventListener('touchend',e=>{e.preventDefault();if(alive)flip();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&alive){e.preventDefault();flip();}});
</script>
