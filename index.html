<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Gravity | Premium Web Game</title>
    <meta name="description" content="A fast-paced gravity flipping game with stunning neon aesthetics. Survive the twisting tunnel and top the leaderboards.">
    <!-- Load modern Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <!-- Background aesthetic elements -->
        <div class="bg-glow"></div>
        
        <!-- Interactive Game Canvas -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Heads Up Display (during gameplay) -->
        <header id="hud" class="hidden">
            <div class="stat-box">
                <span class="label">TIME</span>
                <span class="value" id="timeValue">0.0</span>
            </div>
            <div class="stat-box">
                <span class="label">FLIPS</span>
                <span class="value" id="flipsValue">0</span>
            </div>
            <div class="stat-box">
                <span class="label">SPEED</span>
                <span class="value" id="speedValue">1.0x</span>
            </div>
            <div class="stat-box">
                <span class="label">BEST</span>
                <span class="value" id="bestValue">0.0</span>
            </div>
        </header>

        <!-- UI Overlay (Menu & Game Over) -->
        <div id="uiLayer">
            <div class="logo-wrapper">
                <div class="logo">NEON<br>GRAVITY</div>
            </div>
            <p class="subtitle">Navigate the infinite neon tunnel. Tap or click to flip gravity left and right. Avoid the glowing walls.</p>
            
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Enter your alias" maxlength="12" autocomplete="off">
            </div>

            <button id="startBtn" class="primary-btn">
                <span>INITIALIZE SEQUENCE</span>
            </button>

            <!-- Dynamic Leaderboard -->
            <div id="leaderboard" class="leaderboard hidden">
                <h3>TOP RUNNERS</h3>
                <div class="lb-header">
                    <span>RANK</span>
                    <span>ALIAS</span>
                    <span style="text-align: right;">TIME</span>
                </div>
                <div id="lbContent" class="lb-content">
                    <!-- Javascript populates entries here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Load game logic -->
    <script src="game.js"></script>
</body>
</html>
